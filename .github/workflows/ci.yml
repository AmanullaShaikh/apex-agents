name: CI & Integrity Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate specialist manifests
        run: npm run test:agents

      - name: Run full test suite
        run: npm test

      - name: Run workspace secret scan
        run: node ./scripts/scan-secrets.js

      - name: Run AST bug auditor
        run: node ./scripts/audit-bugs.js

      - name: Verify npm package tarball
        run: npm pack --dry-run

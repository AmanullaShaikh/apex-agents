name: CI & Agent Integrity Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Agent Schema & Zero-Slop Validator
        run: npm test

      - name: Run Secret Leak Sentinel
        run: npm run scan-secrets

      - name: Run Evaluation Benchmark Harness
        run: node ./bin/apex.js eval

      - name: Run CLI Smoke Tests
        run: |
          node ./bin/apex.js --version
          node ./bin/apex.js list
          node ./bin/apex.js doctor
          node ./bin/apex.js budget
